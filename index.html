<style>
/* Layout: a black-ink notebook on white paper. Outlined cards and chips, condensed display titles, bottom tab bar (side rail from 900px), bottom sheets.
   One number, --w (0 to 1, set from the 7-day average day score), brings color back: 0 is pure black and white, low values are pastels, 1 is vibrant.
   Each section sets its own hue with --h. Deliberately light-only: the design is ink on paper. */
@property --w { syntax: "<number>"; inherits: true; initial-value: 0; }
:root {
  color-scheme: light;
  --w: 0; --h: 165;
  --paper: #FFFFFF; --ink: #111111; --ink-2: #4A4A4A; --ink-3: #8C8C8C; --rule: #E4E4E4; --wash: #F4F4F4; --wash-2: #E9E9E9;
  --line: 2px; --line-thin: 1.5px;
  --good: #1F7A47; --warn: #A8650A; --bad: #B4322A;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --display: "Bebas Neue", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", Impact, sans-serif;
  --r: 12px; --r-sm: 9px; --row-h: 50px; --tab-h: 60px;
  transition: --w 1.4s ease;
}

/* base */
*, *::before, *::after { box-sizing: border-box;
  /* color that returns, computed per element so each section's --h applies: tint = card fill, pop = selected fill, deep = accent strokes */
  --tint: oklch(calc(1 - var(--w) * .04) calc(var(--w) * .045) var(--h));
  --pop: oklch(calc(.96 - var(--w) * .2) calc(var(--w) * .2) var(--h));
  --deep: oklch(calc(.18 + var(--w) * .27) calc(var(--w) * .16) var(--h)); }
html { -webkit-text-size-adjust: 100%; overflow-x: hidden; touch-action: manipulation; } /* no sideways page panning, no double-tap zoom; pinch-zoom still works */
html.sheet-open { overflow: hidden; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.35; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* shell */

.col { max-width: 680px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
#navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px;
  padding-left: max(18px, env(safe-area-inset-left, 0px), calc((100% - 644px) / 2)); padding-right: max(18px, env(safe-area-inset-right, 0px), calc((100% - 644px) / 2));
  background: var(--paper); border-bottom: var(--line) solid transparent; transition: border-color .2s; }
#navbar.hairline { border-bottom-color: var(--ink); }

#navbar.compact .nav-title { opacity: 1; }
.nav-side { display: flex; align-items: center; min-width: 0; }

/* tab bar */

  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
  background: var(--paper); border-top: var(--line) solid var(--ink); }

.row-value { color: var(--ink-2); font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { width: 18px; height: 18px; color: var(--ink); stroke-width: 2.6; margin-right: -4px; }
.row.action { color: var(--ink); font-weight: 700; }
.row.action .row-label { font-weight: 700; }
.row.action .lead { width: 22px; height: 22px; stroke-width: 2.6; }
.row.action.destructive { color: var(--bad); }
.row.prose { display: block; line-height: 1.55; font-size: 16px; }
.accent-row { background: var(--pop); --h: 165; }
.mono .accent-row { background: var(--wash); }
.accent-row .row-label { font-weight: 700; }
.footnote, .intro-text { font-size: 13px; color: var(--ink-2); margin: -12px 2px 28px; line-height: 1.45; }
.intro-text { margin: 8px 2px 20px; font-size: 15px; }

/* fields */
/* iOS draws date and time fields at a fixed minimum width that ignores their box; dropping the native look lets them fit */
input[type=date], input[type=time] { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; }

.row input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]), .row select, .row textarea, .searchbar input, .sheet input:not([type=checkbox]):not([type=radio]), .sheet select, .sheet textarea {
  font-size: 17px; background: transparent; border: 0; outline: 0; min-width: 0; color: var(--ink); }
.row input::placeholder, .row textarea::placeholder, .searchbar input::placeholder { color: var(--ink-3); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: var(--line) solid var(--ink); font-size: 17px; font-weight: 700; cursor: pointer; background: var(--paper); color: var(--ink); }
